# ByteTrack settings for this project. Lower thresholds so small, low-confidence
# objects (pedestrians) can start a track. Raise these numbers if you get junk boxes.
tracker_type: bytetrack
track_high_thresh: 0.15   # detections above this can be matched to tracks
track_low_thresh: 0.05    # weak detections help keep existing tracks alive
new_track_thresh: 0.15    # a detection above this can start a NEW track
track_buffer: 40          # frames to remember a lost object
match_thresh: 0.8
fuse_score: True
